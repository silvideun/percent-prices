name: Проверка источников цен

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Опросить Zaka-Zaka, Plati, Steam и ЦБ РФ
        run: node .github/scripts/probe-sources.mjs
